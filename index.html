<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos de Sistemas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            font-weight: bold;
        }
        select, input, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }
        button {
            background-color: #0078D4;
            color: white;
            padding: 10px 15px;
            border: none;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        button:hover {
            background-color: #005A9E;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Pedidos de Sistemas</h2>

    <form id="pedidoForm">

        <div class="form-group">
            <label for="tipo">Tipo de Solicitud</label>
            <select id="tipo" required>
                <option value="">Seleccione...</option>
                <option value="Mejora">Mejora</option>
                <option value="Corrección">Corrección</option>
                <option value="Nueva funcionalidad">Nueva funcionalidad</option>
            </select>
        </div>

        <div class="form-group" id="grupoSistema">
            <label for="sistema">Sistema</label>
            <select id="sistema">
                <option value="">Seleccione...</option>
                <option value="WMS">WMS</option>
                <option value="TMS">TMS</option>
                <option value="SmartDispatch">SmartDispatch</option>
                <option value="PowerBI">PowerBI</option>
            </select>
        </div>

        <div class="form-group">
            <label for="necesidad">Necesidad</label>
            <input type="text" id="necesidad" required>
        </div>

        <div class="form-group">
            <label for="mejoraEsperada">Mejora esperada</label>
            <textarea id="mejoraEsperada"></textarea>
        </div>

        <div class="form-group">
            <label for="impacto">Impacto en tu trabajo</label>
            <textarea id="impacto"></textarea>
        </div>

        <div class="form-group">
            <label for="urgencia">Nivel de urgencia</label>
            <select id="urgencia" required>
                <option value="">Seleccione...</option>
                <option value="Alta">Alta</option>
                <option value="Media">Media</option>
                <option value="Baja">Baja</option>
            </select>
        </div>

        <div class="form-group">
            <label for="area">Área de negocio</label>
            <input type="text" id="area">
        </div>

        <div class="form-group">
            <label for="justificacion">Justificación</label>
            <textarea id="justificacion" required></textarea>
        </div>

        <button type="submit">Enviar Pedido</button>

    </form>
</div>

<script>
    // Mostrar u ocultar SISTEMA según el tipo de solicitud
    const tipoSelect = document.getElementById("tipo");
    const grupoSistema = document.getElementById("grupoSistema");

    grupoSistema.style.display = "none"; // Ocultar por defecto

    tipoSelect.addEventListener("change", () => {
        const valor = tipoSelect.value;

        if (valor === "Mejora" || valor === "Corrección") {
            grupoSistema.style.display = "block";
        } else {
            grupoSistema.style.display = "none";
            document.getElementById("sistema").value = "";
        }
    });

    document.getElementById("pedidoForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const formData = {
            Tipo: document.getElementById("tipo").value,
            Sistema: document.getElementById("sistema").value,
            Necesidad: document.getElementById("necesidad").value,
            MejoraEsperada: document.getElementById("mejoraEsperada").value,
            Impacto: document.getElementById("impacto").value,
            Urgencia: document.getElementById("urgencia").value,
            Areadenegocio: document.getElementById("area").value,
            Justificacion: document.getElementById("justificacion").value,
            Title: document.getElementById("necesidad").value
        };

        const response = await fetch("/api/createItem", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ formData })
        });

        const result = await response.json();
        alert(result.message || result.error);
    });
</script>

</body>
</html>
